<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="一餐背后：四幕互动冰箱艺术装置。所有记录与台词为模拟。"><title>Visuals</title></head><body><main id="screen" aria-label="互动冰箱装置"><div id="canvas" aria-label="冰箱内部三维场景"></div><div id="shutter" aria-hidden="true"></div><div id="captions" aria-live="polite" hidden><span id="voice"></span><p id="subtitle"></p></div><section id="ingredient-panel" role="dialog" aria-modal="false" aria-labelledby="ingredient-title" hidden><button id="panel-close" aria-label="关闭食材信息">×</button><small>食材信息 / INGREDIENT INFO</small><h2 id="ingredient-title"></h2><dl id="ingredient-fields"></dl><p>艺术模拟 · 不对应真实供货或质检报告</p></section><div id="loading" role="status">场景载入中</div><div id="error" role="alert" hidden></div><div id="debug" hidden></div><div id="help" hidden><h2>测试按键</h2><p>空格：开 / 关门<br>O：开门　C：关门<br>S：声音　T：字幕<br>R：重新开始　F：全屏<br>D：状态　H：收起帮助<br>1—5：选择食材，生成模拟纸条数据</p><small>每幕 12 秒。结束后关门再开门进入下一幕。<br>提前关门暂停。第四幕结束后等待重置。<br>热敏打印机尚未连接；数据仅保存在当前页面内存。</small></div></main><script type="module" src="/src/main.js"></script></body></html>
